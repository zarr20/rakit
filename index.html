<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rakit - Developer Tools Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">

    <style>
        :root[data-theme="light"] {
            --bg-color: #F7F7F7;
            --shape-color: #111111;
            --lime-color: #84cc16;
            --border-color: #E5E5E5;
            --text-btn: #111111;
        }

        :root[data-theme="dark"] {
            --bg-color: #0A0A0A;
            --shape-color: #FFFFFF;
            --lime-color: #a3e635;
            --border-color: #333333;
            --text-btn: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .theme-toggle {
            position: absolute;
            top: 32px;
            right: 32px;
            background: transparent;
            color: var(--text-btn);
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 0;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background-color: var(--shape-color);
            color: var(--bg-color);
            border-color: var(--shape-color);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .logo-container {
            cursor: pointer;
            padding: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .logo-container:active {
            transform: scale(0.98);
        }

        svg {
            display: block;
            width: 100%;
            max-width: 380px;
            height: auto;
            overflow: visible;
        }

        .l-block {
            fill: var(--shape-color);
            transition: fill 0.3s ease;
        }

        .core-square {
            fill: var(--lime-color);
            transform-origin: 60px 60px;
            transition: fill 0.3s ease;
        }

        .wordmark {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 60px;
            fill: var(--lime-color);
            letter-spacing: -0.065em;
            transition: fill 0.3s ease;
        }

        .anim-slide-tl {
            animation: slideTL 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-slide-tr {
            animation: slideTR 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-slide-bl {
            animation: slideBL 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-slide-br {
            animation: slideBR 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideTL {
            0% { transform: translate(-50px, -50px); opacity: 0; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        @keyframes slideTR {
            0% { transform: translate(50px, -50px); opacity: 0; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        @keyframes slideBL {
            0% { transform: translate(-50px, 50px); opacity: 0; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        @keyframes slideBR {
            0% { transform: translate(50px, 50px); opacity: 0; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        .anim-pop-core {
            animation: popCore 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes popCore {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .anim-text-reveal {
            animation: wipeIn 0.7s cubic-bezier(0.7, 0, 0.3, 1) 0.6s forwards;
            clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
        }

        @keyframes wipeIn {
            0% {
                clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
                transform: translateX(-15px);
            }
            100% {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
                transform: translateX(0);
            }
        }

        .hint {
            position: absolute;
            bottom: 32px;
            color: var(--border-color);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .logo-container {
                padding: 24px;
            }

            .theme-toggle {
                top: 20px;
                right: 20px;
                padding: 9px 12px;
                font-size: 10px;
            }

            .hint {
                bottom: 24px;
                font-size: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeBtn">LIGHT MODE</button>

    <div class="logo-container" id="logoContainer" title="Klik untuk mengulang animasi">
        <svg viewBox="0 0 340 120" role="img" aria-label="rakit developer tools logo">
            <g id="logo-mark">
                <rect class="core-square anim-pop-core" x="48" y="48" width="24" height="24"/>

                <polygon class="l-block anim-slide-tl" points="24,24 56,24 56,40 40,40 40,56 24,56"/>
                <polygon class="l-block anim-slide-tr" points="64,24 96,24 96,56 80,56 80,40 64,40"/>
                <polygon class="l-block anim-slide-bl" points="24,64 40,64 40,80 56,80 56,96 24,96"/>
                <polygon class="l-block anim-slide-br" points="80,64 96,64 96,96 64,96 64,80 80,80"/>
            </g>

            <g id="wordmark-group">
                <text x="120" y="80" class="wordmark anim-text-reveal">rakit</text>
            </g>
        </svg>
    </div>

    <div class="hint">Click to Rebuild</div>

    <script>
        const container = document.getElementById('logoContainer');
        const themeBtn = document.getElementById('themeBtn');
        const rootElement = document.documentElement;

        const animations = [
            ['.anim-slide-tl', 'anim-slide-tl'],
            ['.anim-slide-tr', 'anim-slide-tr'],
            ['.anim-slide-bl', 'anim-slide-bl'],
            ['.anim-slide-br', 'anim-slide-br'],
            ['.core-square', 'anim-pop-core'],
            ['.wordmark', 'anim-text-reveal']
        ];

        container.addEventListener('click', () => {
            animations.forEach(([selector, cls]) => {
                document.querySelector(selector).classList.remove(cls);
            });

            void container.offsetWidth;

            animations.forEach(([selector, cls]) => {
                document.querySelector(selector).classList.add(cls);
            });
        });

        themeBtn.addEventListener('click', () => {
            const isDark = rootElement.dataset.theme === 'dark';
            rootElement.dataset.theme = isDark ? 'light' : 'dark';
            themeBtn.textContent = isDark ? 'DARK MODE' : 'LIGHT MODE';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rakit-*</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root[data-theme="light"] {
            --bg: #F7F7F7;
            --shape: #111111;
            --lime: #84CC16;
            --border: #E5E5E5;
            --button-text: #111111;
        }

        :root[data-theme="dark"] {
            --bg: #0A0A0A;
            --shape: #FFFFFF;
            --lime: #A3E635;
            --border: #333333;
            --button-text: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 32px;
            right: 32px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: transparent;
            color: var(--button-text);
            font: 800 11px 'Inter', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .theme-toggle:hover {
            background: var(--shape);
            color: var(--bg);
            border-color: var(--shape);
        }

        .logo-container {
            width: min(100%, 560px);
            padding: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .logo-container:active {
            transform: scale(0.99);
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .l-block {
            fill: var(--shape);
            transition: fill 0.3s ease;
        }

        .core-square {
            fill: var(--lime);
            transform-box: view-box;
            transform-origin: 60px 60px;
            transition: fill 0.3s ease;
        }

        .wordmark {
            fill: var(--lime);
            font-family: 'Inter', sans-serif;
            font-size: 60px;
            font-weight: 700;
            letter-spacing: -3.9px;
            transition: fill 0.3s ease;
        }

        .hint {
            position: fixed;
            bottom: 32px;
            color: var(--border);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
        }

        @media (max-width: 480px) {
            .logo-container {
                padding: 20px;
            }

            .theme-toggle {
                top: 20px;
                right: 20px;
                padding: 9px 12px;
                font-size: 10px;
            }

            .hint {
                bottom: 24px;
                font-size: 9px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeBtn" type="button">LIGHT MODE</button>

    <div class="logo-container" id="logoContainer" title="Klik untuk mengulang animasi">
        <svg id="logoSvg" viewBox="0 0 340 120" role="img" aria-label="rakit">
            <g id="logoMark">
                <polygon id="blockTL" class="l-block" points="24,24 56,24 56,40 40,40 40,56 24,56"/>
                <polygon id="blockTR" class="l-block" points="64,24 96,24 96,56 80,56 80,40 64,40"/>
                <polygon id="blockBL" class="l-block" points="24,64 40,64 40,80 56,80 56,96 24,96"/>
                <polygon id="blockBR" class="l-block" points="80,64 96,64 96,96 64,96 64,80 80,80"/>
                <rect id="core" class="core-square" x="48" y="48" width="24" height="24"/>
            </g>

            <text id="wordmark" class="wordmark" x="120" y="80">rakit</text>
        </svg>
    </div>

    <div class="hint">Click to Rebuild</div>

    <script>
        const container = document.getElementById('logoContainer');
        const themeBtn = document.getElementById('themeBtn');
        const root = document.documentElement;

        const blocks = [
            { id: 'blockTL', x: -50, y: -50 },
            { id: 'blockTR', x: 50, y: -50 },
            { id: 'blockBL', x: -50, y: 50 },
            { id: 'blockBR', x: 50, y: 50 }
        ];

        const mark = document.getElementById('logoMark');
        const wordmark = document.getElementById('wordmark');
        const core = document.getElementById('core');

        // Pusatkan mark dan wordmark berdasarkan bounding box aktual.
        function centerLogo() {
            const markBox = mark.getBBox();
            const textBox = wordmark.getBBox();
            const centerY = markBox.y + markBox.height / 2;
            const textCenterY = textBox.y + textBox.height / 2;
            wordmark.setAttribute('y', Number(wordmark.getAttribute('y')) + centerY - textCenterY);
        }

        // Tunggu font selesai dimuat agar pengukuran teks akurat.
        document.fonts.ready.then(centerLogo);

        function playAnimation() {
            blocks.forEach(({ id, x, y }, index) => {
                const el = document.getElementById(id);
                el.getAnimations().forEach(animation => animation.cancel());
                el.style.opacity = '0';
                el.style.transform = `translate(${x}px, ${y}px)`;

                el.animate([
                    { transform: `translate(${x}px, ${y}px)`, opacity: 0 },
                    { transform: 'translate(0, 0)', opacity: 1 }
                ], {
                    duration: 600,
                    delay: index * 70,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                    fill: 'forwards'
                });
            });

            core.getAnimations().forEach(animation => animation.cancel());
            core.style.opacity = '0';
            core.style.transform = 'scale(0)';

            core.animate([
                { transform: 'scale(0)', opacity: 0 },
                { transform: 'scale(1)', opacity: 1 }
            ], {
                duration: 400,
                delay: 400,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                fill: 'forwards'
            });

            wordmark.getAnimations().forEach(animation => animation.cancel());
            wordmark.style.opacity = '1';
            wordmark.style.clipPath = 'inset(0 100% 0 0)';
            wordmark.style.transform = 'translateX(-15px)';

            wordmark.animate([
                { clipPath: 'inset(0 100% 0 0)', transform: 'translateX(-15px)' },
                { clipPath: 'inset(0 0 0 0)', transform: 'translateX(0)' }
            ], {
                duration: 700,
                delay: 650,
                easing: 'cubic-bezier(0.7, 0, 0.3, 1)',
                fill: 'forwards'
            });
        }

        container.addEventListener('click', playAnimation);

        themeBtn.addEventListener('click', () => {
            const isDark = root.dataset.theme === 'dark';
            root.dataset.theme = isDark ? 'light' : 'dark';
            themeBtn.textContent = isDark ? 'DARK MODE' : 'LIGHT MODE';
        });

        playAnimation();
    </script>
</body>
</html>
